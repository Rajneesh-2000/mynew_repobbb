name: Deploy potfolio 

on:
  push:
    branches:
          
          - main
  

jobs:
   deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy potfolio
        uses: appleboy/ssh-action@v1.2.2
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }} 
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
                 whoami
                 hostname
                 docker --version
                 docker compose version
         
      
